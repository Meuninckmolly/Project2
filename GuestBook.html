<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- import the supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Guestbook</title>
  <style>
    form {
        display: flex;
        flex-direction: column;
        gap: 1rem; 
        margin-bottom: 2rem;
    }
    li {
        margin-bottom: 1.5rem
    }
    li img {
        display: block;
        max-width: 100%;
        max-height: 300px;
        margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Guestbook</h1>
<!-- a form html for submitting a request -->
  <form id="form">
    <input id="name" placeholder="Name (optional)">
    <textarea id="message" placeholder="Leave a message" required></textarea>
    <input id="image" type="file" accept="image/*">
    <button id="submit">Post</button>
  </form>

  <ul id="entries"></ul>

  
  <script>
    const db = supabase.createClient(
        "https://dczcktpmlltkwmcizrfn.supabase.co",
        "sb_publishable_-1-sd9eEsTLvWdsEqLGQmg_PcV-8_rS"
    )
    const BUCKET = "comment-images"

    // Show all comments, newest first
    async function loadComments() {
        // fetch and order the records in the comments table
        const response = await db
            .from("comments")
            .select("*")
            .order("created_at", { ascending: false })

        console.log(response)   // { data: [...], error: null }

        if (response.error) {
            console.log(response.error)
            return
        }

        const list = document.querySelector("#entries")
        list.innerHTML = ""

        // loop through the records from the comments table, create an li html element for each
        for (const entry of response.data) {
            const li = document.createElement("li")
            li.textContent = (entry.name || "Anonymous") + ": " + entry.message
            // append an image if there the record has an image_url
            if (entry.image_url) {
                const img = document.createElement("img")
                img.src = entry.image_url
                img.alt = "Image from " + (entry.name || "Anonymous")
                li.appendChild(img)
            }
            list.appendChild(li)
        }
    }

    // Upload an image (if any), then save the comment
    document.querySelector("#form").addEventListener("submit", async (event) => {
        event.preventDefault() // prevent webpage refresh
        const button = document.querySelector("#submit")
        button.disabled = true

        const name = document.querySelector("#name").value.trim() // trim values in case there are spaces in the input
        const message = document.querySelector("#message").value.trim() // trim values in case there are spaces in the input
        const file = document.querySelector("#image").files[0]
        let imageUrl = null

        if (file) {
        // Give the file a safe, unique name
        const extension = file.name.split(".").pop()
        // create an unique path/name in Bucket
        const path = crypto.randomUUID() + "." + extension 

        const uploadResponse = await db.storage.from(BUCKET).upload(path, file)
        if (uploadResponse.error) {
            console.log(uploadResponse.error)
            alert("Upload failed: " + uploadResponse.error.message)
            button.disabled = false
            return
        }

        const urlResponse = db.storage.from(BUCKET).getPublicUrl(path)
            imageUrl = urlResponse.data.publicUrl
        }

        const insertResponse = await db.from("comments").insert({
            name: name || null, // leave the name null if no name
            message: message,
            image_url: imageUrl
        })
        if (insertResponse.error) {
            console.log(insertResponse.error)
            alert("Could not post: " + insertResponse.error.message)
        }

        event.target.reset()
        button.disabled = false // enable button once everything is done
        loadComments()
    })

    loadComments()
  </script>
</body>
</html>
